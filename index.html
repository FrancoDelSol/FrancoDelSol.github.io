<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f0d">
  <meta name="description" content="Acceso público a Fendy Control">
  <meta http-equiv="refresh" content="2;url=https://fendy-control-stock.francodelsol.chatgpt.site/">
  <link rel="canonical" href="https://fendy-control-stock.francodelsol.chatgpt.site/">
  <title>Fendy Control</title>
  <style>
    :root{--bg:#0b0f0d;--panel:#121713;--line:#354139;--green:#c6f05b;--copper:#d59a62;--text:#edf3ee;--muted:#7d8980}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;padding:24px;color:var(--text);background:
      radial-gradient(circle at 15% 15%,rgba(198,240,91,.1),transparent 28%),
      radial-gradient(circle at 85% 90%,rgba(213,154,98,.09),transparent 30%),
      repeating-linear-gradient(-45deg,rgba(255,255,255,.012) 0 5px,transparent 5px 10px),
      var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(680px,100%);padding:clamp(28px,6vw,58px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(198,240,91,.04),transparent 40%),var(--panel);box-shadow:0 35px 80px rgba(0,0,0,.34)}
    .brand{display:flex;align-items:center;gap:13px;color:var(--green);font:800 12px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
    .mark{width:42px;height:42px;display:grid;place-items:center;border-radius:10px 10px 10px 3px;color:#0a0d0b;background:var(--green);font-size:17px;letter-spacing:-.05em}
    h1{margin:42px 0 16px;font-family:"Arial Narrow","Segoe UI",sans-serif;font-size:clamp(54px,12vw,96px);font-weight:900;line-height:.82;letter-spacing:-.065em}
    h1 span{display:block;color:var(--green)}
    p{max-width:520px;margin:0;color:var(--muted);font-size:15px;line-height:1.65}
    .status{margin:36px 0 22px;padding:15px 17px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;background:#0d120f;color:#aeb9b1;font:700 10px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;text-transform:uppercase}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 6px rgba(198,240,91,.08)}
    a{min-height:48px;padding:0 21px;display:inline-flex;align-items:center;justify-content:center;gap:12px;border-radius:10px;color:#0a0d0b;background:var(--green);font-size:12px;font-weight:900;text-decoration:none;transition:transform .18s ease,filter .18s ease}
    a:hover{transform:translateY(-2px);filter:brightness(1.05)}
    small{margin-top:28px;display:block;color:#556159;font:8px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.1em;text-transform:uppercase}
  </style>
  <script>window.setTimeout(function(){window.location.replace("https://fendy-control-stock.francodelsol.chatgpt.site/")},900)</script>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">FC</span> Fendy · sistema operativo</div>
    <h1>Fendy <span>Control.</span></h1>
    <p>Stock, consumos, costos y carga de mercadería en un mismo lugar.</p>
    <div class="status"><span class="dot"></span> Abriendo la aplicación pública…</div>
    <a href="https://fendy-control-stock.francodelsol.chatgpt.site/">Ingresar a Fendy Control <span aria-hidden="true">→</span></a>
    <small>Acceso público · FrancoDelSol.github.io</small>
  </main>
</body>
</html>
